# Free Supabase projects pause after 7 days without activity. This pings the DB twice a week.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call public.ping()
        env:
          # Publishable key is public by design (data is protected by RLS).
          SUPABASE_URL: https://vmfmfgnehyuilxabgajo.supabase.co
          SUPABASE_KEY: sb_publishable_gA-1kS4T1fSHGy5TOVCGnw_Tzv2ng01
        run: |
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
