<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Sealbox">
  <defs>
    <linearGradient id="sb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sb-seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#sb-bg)"/>

  <!-- Box body -->
  <rect x="60" y="120" width="136" height="84" rx="14" fill="#FFFFFF"/>
  <!-- Box lid (slightly wider, separated by a seam) -->
  <rect x="48" y="78" width="160" height="34" rx="12" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Seal across the seam -->
  <circle cx="128" cy="116" r="34" fill="url(#sb-bg)"/>
  <circle cx="128" cy="116" r="28" fill="url(#sb-seal)"/>
  <circle cx="128" cy="116" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Keyhole -->
  <path d="M128 102a8 8 0 0 1 4.2 14.8L135 131h-14l2.8-14.2A8 8 0 0 1 128 102z" fill="#3730A3"/>
</svg>
